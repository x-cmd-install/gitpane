:"2026-10-30T04:57:56Z","updated_at":"2026-10-30T04:57:57Z"},{"id":690983381,"node_id":"RA_kwDORXwmec4pL5HV","name":"gitpane-x86_64-apple-darwin.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":4995897,"digest":"sha256:41d1216fb523dfa3adea3980e886496c3aca919a0ef43786cab1db3cfe8f6235","download_count":1,"created_at":"2026-10-30T04:57:56Z","updated_at":"2026-10-30T04:57:57Z"},{"id":690983380,"node_id":"RA_kwDORXwmec4pL5HU","name":"gitpane-x86_64-pc-windows-msvc.zip","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/zip","state":"uploaded","size":4954699,"digest":"sha256:763690733eddace86697470b03ac1cd273ef1830e138f286a0bf5465f39f4599","download_count":1,"created_at":"2026-10-30T04:57:56Z","updated_at":"2026-10-30T04:57:57Z"},{"id":690983379,"node_id":"RA_kwDORXwmec4pL5HT","name":"gitpane-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":5636347,"digest":"sha256:fd7fc97da397d7ee291eb748bb7a955f92c19b960fbf9478a97fd3ab4dd7584a","download_count":4,"created_at":"2026-10-30T04:57:56Z","updated_at":"2026-10-30T04:57:57Z"},{"id":690983376,"node_id":"RA_kwDORXwmec4pL5HQ","name":"gitpane-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":5926541,"digest":"sha256:dc093f3f7e84e21829e5cef2a7b48fc9109511f976b8f745fa6578b88c5b7880","download_count":2,"created_at":"2026-10-30T04:57:56Z","updated_at":"2026-10-30T04:57:57Z"}],"body":"## [0.18.0] - 2026-10-29\n\n### Added\n- Gitpane Explorer for VS Code shows workspace repositories, linked worktrees and changed files beside the file tree. It updates as workspace repositories change and opens file changes in the editor. The extension includes branch review, the commit graph, repository and worktree actions, submodule inspection, sessions, themes and configured launchers. ([#107](https://github.com/affromero/gitpane/pull/107), closes [#106](https://github.com/affromero/gitpane/issues/106))\n- Install Gitpane Explorer from the VS Code Marketplace, or download a VSIX with its bundled backend for Apple Silicon and Intel Macs, Linux ARM64 and x64, and Windows x64. The README includes a rendered preview, installation steps and settings. ([#107](https://github.com/affromero/gitpane/pull/107))\n\n### Fixed\n- Git process arguments use ordinary Windows paths while repository identity checks retain canonical paths. This fixes content reads and worktree operations that failed on canonical Windows paths. ([#107](https://github.com/affromero/gitpane/pull/107))\n- Parent repository status remains available when a registered submodule is replaced by a file or symlink. ([#107](https://github.com/affromero/gitpane/pull/107))\n- Update libz-sys to 1.1.31 for RUSTSEC-2026-0418 and include the latest merged Git and TLS dependency fixes. ([#107](https://github.com/affromero/gitpane/pull/107), [#104](https://github.com/affromero/gitpane/pull/104), [#102](https://github.com/affromero/gitpane/pull/102), [#96](https://github.com/affromero/gitpane/pull/96))\n\n---\n\nFull changelog: https://github.com/affromero/gitpane/blob/main/CHANGELOG.md\n"}
